<svg fill="none" viewBox="0 0 800 50" width="100%" height="50" xmlns="http://www.w3.org/2000/svg">
  <style>
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1px; }
    
    .text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 16px;
      fill: #24292f;
      /* 'linear' keeps the speed perfectly smooth. 'infinite' makes it loop forever. */
      animation: scroll 12s linear infinite;
    }

    /* 1. Define your custom word colors here (Light Mode) */
    .colour-bang { fill: #ff4500; font-weight: bold; }
    .colour-date { fill: #daa520; font-weight: bold; }

    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #30363d; }
      .text { fill: #c9d1d9; }
      /* 2. Dark mode equivalents so the colors remain readable */
      .colour-bang { fill: #FE4C25; }
      .colour-date { fill: #F08A3A; }
    }

    /* 3. The Animation Loop */
    @keyframes scroll {
      /* Start completely hidden on the right */
      0% { transform: translateX(100%); }
      /* Move left by 100% of the text's own width, ensuring it completely exits */
      100% { transform: translateX(-100%); }
    }
  </style>

  <rect width="100%" height="100%" rx="6" class="box" />
  
  <!-- 4. xml:space="preserve" is critical here, otherwise SVG will delete the spaces around your <tspan> tags -->
  <text x="0" y="31" class="text" xml:space="preserve">
    ⚠️<tspan class="colour-bang">Latest Milestone</tspan>⚠️ <tspan class="colour-date">19 September 2026:</tspan> Custom narration successfully played on a single page
  </text>
</svg>

